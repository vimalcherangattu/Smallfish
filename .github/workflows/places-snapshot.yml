# Data sourcing step 1 (docs/DATA-SOURCING.md): keep our own copy of the US
# places current. Weekly, because Overture publishes monthly and deletes after
# about two months; a week's lag is fine and a missed month is not.
#
# A failed run means the contract held the new release back and the live copy
# is still serving. GitHub emails the repository owner when a scheduled run
# fails, which is the alert.
name: places snapshot

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      release:
        description: "Overture release to copy (blank = newest)"
        required: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install duckdb boto3
      - name: Build, check and promote
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -n "${{ inputs.release }}" ]; then
            python3 stage0/src/coverage/snapshot_places.py --r2 --release "${{ inputs.release }}"
          else
            python3 stage0/src/coverage/snapshot_places.py --r2 --if-new
          fi
