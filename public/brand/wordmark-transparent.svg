<svg xmlns="http://www.w3.org/2000/svg" width="440" height="120" viewBox="0 0 440 120" role="img" aria-label="Small Fish">
  <!-- Transparent ground, for surfaces whose background we do not control:
       Stripe's checkout and invoices, an email signature, a slide. The paper
       version sits a shade off-white on a white page, which reads as a
       mistake rather than as a colour. -->
  <g transform="translate(28 36)">
    <path d="M26 16 L44 5.5 Q41 16 44 26.5 Z" fill="#C8F03C"/>
    <circle cx="17" cy="16" r="12" fill="#C8F03C"/>
    <circle cx="11.5" cy="12.5" r="2.3" fill="#0E1520"/>
    <path d="M9.5 21 Q13.5 25 19 24.6" fill="none" stroke="#0E1520" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="104" y="70" font-family="IBM Plex Sans, Inter, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="500" fill="#0E1520" letter-spacing="-0.5">small fish</text>
</svg>
